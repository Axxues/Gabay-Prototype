name: Sync Syllabi to Upstash Vector

on:
  schedule:
    # Run nightly at 18:00 UTC (2:00 AM Philippine Standard Time / PHT, UTC+8)
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  sync-syllabi:
    name: Sync Published Syllabi
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'rag-service/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r rag-service/requirements.txt

      - name: Run syllabus ingestion
        working-directory: rag-service
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          UPSTASH_VECTOR_REST_URL: ${{ secrets.UPSTASH_VECTOR_REST_URL }}
          UPSTASH_VECTOR_REST_TOKEN: ${{ secrets.UPSTASH_VECTOR_REST_TOKEN }}
          LIKHA_URL: ${{ secrets.LIKHA_URL }}
          LIKHA_TOKEN: ${{ secrets.LIKHA_TOKEN }}
        run: |
          python ingest.py
